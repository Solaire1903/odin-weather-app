<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>

  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <div id="content-area">
      <div id="current-weather-content">
        <h2 id="datetime-display"></h2>
        <h2 id="location-display"></h2>
        <img src="" alt="" id="current-weather-icon" />
        <span id="description-display"></span>
        <span id="current-temperature"></span>
        <span id="current-feelslike"></span>
        <span id="tempmin-display"></span>
        <span id="tempmax-display"></span>
        <div id="temperature-toggle" hidden>
          <label for="temperature-toggle-checkbox">Show in Fahrenheit:</label>
          <input type="checkbox" id="temperature-toggle-checkbox" />
        </div>
      </div>

      <form novalidate>
        <label for="location-input">Enter Location:</label>
        <input type="text" id="location-input" />
        <button type="submit">Search</button>
      </form>
      <span id="search-error"></span>
    </div>
  </body>
</html>
