<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>

  <body>
    <header>
      <h1>Weather App</h1>
    </header>

    <div id="content-area">
      <div id="current-weather-content">
        <img src="" alt="" id="current-weather-icon" />
        <span id="current-temperature"></span>
        <span id="current-feelslike"></span>
      </div>

      <form novalidate>
        <label for="location-input">Enter Location:</label>
        <input type="text" id="location-input" />
        <button type="submit">Search</button>
      </form>
    </div>
  </body>
</html>
